plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modCompileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-fabric-api:${cc_tweaked_version}"
    modRuntimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-fabric:${cc_tweaked_version}"

    include implementation('javazoom:jlayer:1.0.1')
    include implementation('org.jcraft:jorbis:0.0.17')
    include implementation('com.tianscar.javasound:jaad:0.9.4')
}

loom {
    runs {
        client {
            client()
            setConfigName('OpenFM Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('OpenFM Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

