plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.28' apply false
}

def defaultBuildNumber = mod_version == mod_version_seed ? mod_version_seed_build : '1'
def buildNumber = providers.gradleProperty('build_number')
        .getOrElse(defaultBuildNumber)
        .trim()

if (!(buildNumber ==~ /\d+/) || buildNumber.toInteger() < 1) {
    throw new GradleException("build_number must be a positive integer, got '${buildNumber}'")
}

allprojects {
    version = "${mod_version}.${buildNumber}"
    repositories {
        maven {
            name = 'Sable Companion'
            url = 'https://maven.ryanhcode.dev/releases'
            content { includeGroup 'dev.ryanhcode.sable-companion' }
        }
    }
}

tasks.register('publishCurseForge') {
    group = 'publishing'
    description = 'Build and publish both the Fabric and NeoForge JARs to CurseForge.'
    dependsOn(':fabric:publishCurseForge', ':neoforge:publishCurseForge')
}

// Keep the loader run targets explicit. A root-level `runClient` is ambiguous
// because both loader projects expose one, so IntelliJ can otherwise launch
// Fabric and then NeoForge in sequence.
def registerLoaderRunTask = { String name, String target, String description ->
    tasks.register(name) {
        group = 'run'
        this.description = description
        dependsOn(target)
    }
}

registerLoaderRunTask('runFabricClient', ':fabric:runClient', 'Launch the Fabric development client.')
registerLoaderRunTask('runNeoForgeClient', ':neoforge:runClient', 'Launch the NeoForge development client.')
registerLoaderRunTask('runFabricServer', ':fabric:runServer', 'Launch the Fabric development server.')
registerLoaderRunTask('runNeoForgeServer', ':neoforge:runServer', 'Launch the NeoForge development server.')
