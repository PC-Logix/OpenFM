plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

group = project.mod_group_id
version = project.mod_version

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        dependencies {
            runtime "javazoom:jlayer:1.0.1"
            runtime "org.jcraft:jorbis:0.0.17"
            runtime "com.tianscar.javasound:jaad:0.9.4"
        }
    }

    client {}

    server {
        argument '--nogui'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()

    // CC:Tweaked Maven (note: maven.squiddev.cc, NOT squiddev.cc/maven)
    maven {
        url "https://maven.squiddev.cc"
        content { includeGroup "cc.tweaked" }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    // Compile against and embed the stream decoder libraries in the distributable mod jar.
    jarJar(implementation("javazoom:jlayer:[1.0.1]")) {
        version { prefer "1.0.1" }
    }
    jarJar(implementation("org.jcraft:jorbis:[0.0.17]")) {
        version { prefer "0.0.17" }
    }
    jarJar(implementation("com.tianscar.javasound:jaad:[0.9.4]")) {
        version { prefer "0.9.4" }
    }

    // CC:Tweaked still publishes its 1.21.1 NeoForge-compatible build under the forge classifier.
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:${project.cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-forge-api:${project.cc_tweaked_version}"
    localRuntime "cc.tweaked:cc-tweaked-${project.minecraft_version}-forge:${project.cc_tweaked_version}"

}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            cc_tweaked_version: cc_tweaked_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
